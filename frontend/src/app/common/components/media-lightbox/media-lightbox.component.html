<div *ngIf="mediaItem" class="media-lightbox-container">

  <div
    class="main-media-container"
    [ngClass]="[
      aspectRatioClass,
      (!isVideo && !isAudio) ? 'zoomable' : '',
      isAudio ? '!bg-transparent !shadow-none !h-full flex-col' : ''
    ]"
    (click)="(!isVideo && !isAudio) && openPhotoSwipe(selectedIndex)"
  >
    <!-- Audio Stage Visuals -->
    <div *ngIf="isAudio" class="audio-stage-layout">
        <div class="audio-icon-container">
            <mat-icon class="stage-icon">music_note</mat-icon>
        </div>
        <div class="audio-metadata">
            <h2 class="audio-prompt">{{ mediaItem.prompt || 'Untitled Audio' }}</h2>
            <p class="audio-type">{{ mediaItem.mimeType }}</p>
        </div>
    </div>
    <ng-container *ngIf="!isVideo && !isAudio && selectedUrl">
      <img
        [ngSrc]="selectedUrl"
        [alt]="mediaItem.prompt || $any(mediaItem).originalPrompt"
        fill
        priority
        class="main-media"
        (load)="onImageLoad($event)"
      />
    </ng-container>

    <ng-container *ngIf="isVideo && selectedUrl">
      <div class="video-wrapper" (click)="toggleVideoPlay()" style="width: 100%; height: 100%;">
        <video
          #videoPlayer
          [src]="selectedUrl"
          [poster]="posterUrl"
          class="main-media"
          controls
          muted
        ></video>
      </div>
    </ng-container>

    <ng-container *ngIf="isAudio && selectedUrl">
        <div class="custom-audio-player glass-effect">
            <audio #audioPlayer
                   [src]="selectedUrl"
                   (timeupdate)="onTimeUpdate()"
                   (loadedmetadata)="onAudioLoaded()"
                   (ended)="onAudioEnded()"
                   hidden>
            </audio>

            <button mat-icon-button class="play-btn" (click)="togglePlay()">
                <mat-icon class="!w-10 !h-10 !text-[40px] leading-[40px]">
                    {{ isPlaying ? 'pause_circle' : 'play_circle' }}
                </mat-icon>
            </button>

            <span class="time-text">{{ currentTime }}</span>

            <mat-slider class="custom-slider" min="0" max="100" step="0.1">
                <input matSliderThumb [value]="progressValue" (valueChange)="seek($event)">
            </mat-slider>

            <span class="time-text">{{ duration }}</span>
        </div>
    </ng-container>
  </div>

  <!-- Bottom Controls: Thumbnails and Actions -->
  <div
    *ngIf="mediaItem.presignedUrls && mediaItem.presignedUrls.length >= 1"
    class="bottom-controls"
  >
    <!-- Thumbnails on the left -->
    <div class="thumbnails-container">
      <div
        *ngFor="
          let url of mediaItem.presignedThumbnailUrls?.length
            ? mediaItem.presignedThumbnailUrls
            : mediaItem.presignedUrls;
          let i = index
        "
        class="thumbnail"
        [class.active]="i === selectedIndex"
        [class.audio-thumb]="isAudio"
        (click)="selectMedia(i)"
        [matTooltip]="isAudio ? 'Track ' + (i + 1) : ''"
      >
        <img *ngIf="!isAudio" [src]="url" [alt]="'Thumbnail ' + (i + 1)" />

        <div *ngIf="isAudio" class="audio-icon-wrapper">
            <mat-icon>graphic_eq</mat-icon>
            <span class="track-num">{{ i + 1 }}</span>
        </div>
      </div>
    </div>

    <!-- Actions Toolbar on the right -->
    <div class="media-actions-toolbar" *ngIf="mediaItem">

      <studio-button
        *ngIf="showEditButton"
        variant="primary"
        shape="circle"
        size="medium"
        (click)="onEditClick()"
        matTooltip="Edit this media"
      >
        <mat-icon>edit</mat-icon>
      </studio-button>

      <studio-button
        *ngIf="showGenerateVideoButton && !isVideo"
        variant="primary"
        shape="circle"
        size="medium"
        [matMenuTriggerFor]="videoMenu"
        matTooltip="Generate video"
      >
        <mat-icon>videocam</mat-icon>
      </studio-button>
      <mat-menu #videoMenu="matMenu">
        <button mat-menu-item (click)="onGenerateVideoClick('start')">
          Use as Start Image
        </button>
        <button mat-menu-item (click)="onGenerateVideoClick('end')">
          Use as End Image
        </button>
      </mat-menu>

      <studio-button
        *ngIf="showShareButton"
        variant="primary"
        shape="circle"
        size="medium"
        (click)="toggleShareMenu()"
        matTooltip="Share"
      >
        <mat-icon>share</mat-icon>
      </studio-button>

      <studio-button
        *ngIf="showDownloadButton"
        variant="primary"
        shape="circle"
        size="medium"
        (click)="openInNewTab()"
        matTooltip="Download"
        [disabled]="isDownloading"
      >
        <mat-spinner *ngIf="isDownloading" [diameter]="20"></mat-spinner>
        <mat-icon *ngIf="!isDownloading">download</mat-icon>
      </studio-button>

      <studio-button
        *ngIf="showSeeMoreInfoButton"
        variant="primary"
        shape="circle"
        size="medium"
        (click)="seeMoreInfo()"
        matTooltip="See more info"
      >
        <mat-icon>info_outline</mat-icon>
      </studio-button>

      <studio-button
        variant="primary"
        shape="circle"
        size="medium"
        (click)="openAssignTagsDialog()"
        matTooltip="Assign tags"
      >
        <mat-icon>label</mat-icon>
      </studio-button>

      <studio-button
        *ngIf="showDeleteButton"
        variant="primary"
        shape="circle"
        size="medium"
        (click)="onDeleteClick()"
        matTooltip="Delete"
      >
        <mat-icon>delete</mat-icon>
      </studio-button>
      
      <studio-button
        *ngIf="isVideo"
        variant="primary"
        size="medium"
        (click)="onExtendWithAiClick()"
        matTooltip="Extend with AI"
      >
        <mat-icon>auto_awesome</mat-icon>
        Extend
      </studio-button>
      
      <studio-button
        *ngIf="isVideo"
        variant="primary"
        size="medium"
        (click)="onConcatenateClick()"
        matTooltip="Concatenate Video"
      >
        <mat-icon>add_to_photos</mat-icon>
        Concatenate
      </studio-button>
    </div>

  </div>
</div>

<!-- Share Menu -->
<div
  *ngIf="isShareMenuOpen"
  class="share-menu-overlay"
  (click)="toggleShareMenu()"
>
  <div class="share-menu" (click)="$event.stopPropagation()">
    <div class="share-menu-header">
      <h3>Share</h3>
      <button class="close-button" (click)="toggleShareMenu()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <ul class="share-menu-list">
      <li>
        <button (click)="copyLink()">
          <mat-icon>link</mat-icon>
          <span>Copy Link</span>
        </button>
      </li>
      <li>
        <button (click)="shareToGroupGallery()" class="share-to-group">
          <mat-icon>groups</mat-icon>
          <span>Share to Group Gallery</span>
        </button>
      </li>
    </ul>
  </div>
</div>
