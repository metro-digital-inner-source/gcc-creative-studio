<mat-sidenav-container class="analytics-container container mx-auto">
  <mat-sidenav mode="side" position="end" fixedInViewport opened class="analytics-sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/analytics" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon matListItemIcon>analytics</mat-icon>
        <span matListItemTitle>Usage Analytics</span>
      </a>
      <a mat-list-item routerLink="/admin/users">
        <mat-icon matListItemIcon>manage_accounts</mat-icon>
        <span matListItemTitle>Admin Panel</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="!m-0 !p-10">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
