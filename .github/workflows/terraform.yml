name: Terraform CI/CD

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - develop
      - test
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
      - develop
      - test
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # Detect which environment to apply changes to based on branch
  detect-env:
    name: Detect Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      secret-suffix: ${{ steps.detect.outputs.secret-suffix }}
      gcp-project: ${{ steps.detect.outputs.gcp-project }}
      tfvars-file: ${{ steps.detect.outputs.tfvars-file }}
      branch-name: ${{ steps.detect.outputs.branch-name }}
    steps:
      - name: Detect target environment
        id: detect
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "secret-suffix=PROD" >> $GITHUB_OUTPUT
            echo "gcp-project=cf-genaistudi-genai-studio--7u" >> $GITHUB_OUTPUT
            echo "tfvars-file=prod/prod.tfvars" >> $GITHUB_OUTPUT
            echo "branch-name=main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "test" || "${{ github.ref }}" == "refs/heads/test" ]]; then
            echo "environment=pp" >> $GITHUB_OUTPUT
            echo "secret-suffix=PP" >> $GITHUB_OUTPUT
            echo "gcp-project=cf-genaistudi-genai-studio--vm" >> $GITHUB_OUTPUT
            echo "tfvars-file=pp/pp.tfvars" >> $GITHUB_OUTPUT
            echo "branch-name=test" >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "develop" || "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "secret-suffix=DEV" >> $GITHUB_OUTPUT
            echo "gcp-project=cf-genaistudi-genai-studio--gv" >> $GITHUB_OUTPUT
            echo "tfvars-file=dev/dev.tfvars" >> $GITHUB_OUTPUT
            echo "branch-name=develop" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch. Cannot determine environment."
            exit 1
          fi

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: detect-env
    if: github.event_name == 'pull_request'
    environment: ${{ needs.detect-env.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Resolve auth inputs
        id: auth-inputs
        env:
          TF_WIF_PROVIDER: ${{ needs.detect-env.outputs.environment == 'dev' && (secrets.TF_WIF_PROVIDER_DEV || secrets.TF_WIF_PROVIDER_dev) || needs.detect-env.outputs.environment == 'pp' && (secrets.TF_WIF_PROVIDER_PP || secrets.TF_WIF_PROVIDER_pp) || (secrets.TF_WIF_PROVIDER_PROD || secrets.TF_WIF_PROVIDER_prod) }}
          TF_SA_EMAIL: ${{ needs.detect-env.outputs.environment == 'dev' && (secrets.TF_SA_EMAIL_DEV || secrets.TF_SA_EMAIL_dev) || needs.detect-env.outputs.environment == 'pp' && (secrets.TF_SA_EMAIL_PP || secrets.TF_SA_EMAIL_pp) || (secrets.TF_SA_EMAIL_PROD || secrets.TF_SA_EMAIL_prod) }}
        run: |
          if [[ -z "$TF_WIF_PROVIDER" || -z "$TF_SA_EMAIL" ]]; then
            echo "auth_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Missing Terraform WIF secrets for environment '${{ needs.detect-env.outputs.environment }}'."
            echo "Skipping terraform-plan for this PR run."
            exit 0
          fi

          if [[ ! "$TF_WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "Invalid TF_WIF_PROVIDER format: $TF_WIF_PROVIDER"
            echo "Expected: projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL_ID>/providers/<PROVIDER_ID>"
            echo "Fix by re-running infra/bootstrap/wif-setup.sh and updating GitHub secret TF_WIF_PROVIDER_*"
            exit 1
          fi

          echo "auth_enabled=true" >> "$GITHUB_OUTPUT"
          echo "workload_identity_provider=$TF_WIF_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "service_account=$TF_SA_EMAIL" >> "$GITHUB_OUTPUT"

      - name: Skip plan when auth is unavailable
        if: ${{ steps.auth-inputs.outputs.auth_enabled != 'true' }}
        run: |
          echo "Terraform plan was skipped because WIF secrets are not configured for this environment."

      - name: Authenticate to Google Cloud
        if: ${{ steps.auth-inputs.outputs.auth_enabled == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.auth-inputs.outputs.workload_identity_provider }}
          service_account: ${{ steps.auth-inputs.outputs.service_account }}

      - name: Set up Cloud SDK
        if: ${{ steps.auth-inputs.outputs.auth_enabled == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Initialize Terraform
        if: ${{ steps.auth-inputs.outputs.auth_enabled == 'true' }}
        working-directory: infra/environments/${{ needs.detect-env.outputs.environment }}
        run: terraform init

      - name: Run Terraform Plan
        if: ${{ steps.auth-inputs.outputs.auth_enabled == 'true' }}
        working-directory: infra/environments/${{ needs.detect-env.outputs.environment }}
        run: |
          terraform plan \
            -var-file="${{ needs.detect-env.outputs.tfvars-file }}" \
            -out=tfplan

      - name: Generate Terraform Plan Summary
        id: plan-summary
        if: ${{ steps.auth-inputs.outputs.auth_enabled == 'true' }}
        working-directory: infra/environments/${{ needs.detect-env.outputs.environment }}
        run: |
          terraform show -no-color tfplan > plan_output.txt
          cat plan_output.txt

      - name: Post plan to PR
        if: ${{ steps.auth-inputs.outputs.auth_enabled == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infra/environments/${{ needs.detect-env.outputs.environment }}/plan_output.txt', 'utf8');
            
            const comment = `## Terraform Plan - ${{ needs.detect-env.outputs.environment }} Environment
            
            \`\`\`
            ${planOutput.substring(0, 3000)}
            \`\`\`
            
            **Environment**: ${{ needs.detect-env.outputs.environment }}
            **GCP Project**: ${{ needs.detect-env.outputs.gcp-project }}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: detect-env
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ needs.detect-env.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Resolve auth inputs
        id: auth-inputs
        env:
          TF_WIF_PROVIDER: ${{ needs.detect-env.outputs.environment == 'dev' && (secrets.TF_WIF_PROVIDER_DEV || secrets.TF_WIF_PROVIDER_dev) || needs.detect-env.outputs.environment == 'pp' && (secrets.TF_WIF_PROVIDER_PP || secrets.TF_WIF_PROVIDER_pp) || (secrets.TF_WIF_PROVIDER_PROD || secrets.TF_WIF_PROVIDER_prod) }}
          TF_SA_EMAIL: ${{ needs.detect-env.outputs.environment == 'dev' && (secrets.TF_SA_EMAIL_DEV || secrets.TF_SA_EMAIL_dev) || needs.detect-env.outputs.environment == 'pp' && (secrets.TF_SA_EMAIL_PP || secrets.TF_SA_EMAIL_pp) || (secrets.TF_SA_EMAIL_PROD || secrets.TF_SA_EMAIL_prod) }}
        run: |
          if [[ -z "$TF_WIF_PROVIDER" || -z "$TF_SA_EMAIL" ]]; then
            echo "Missing Terraform WIF secrets for environment '${{ needs.detect-env.outputs.environment }}'."
            echo "Expected one of: TF_WIF_PROVIDER_DEV/dev, TF_SA_EMAIL_DEV/dev (or PP/pp, PROD/prod)."
            exit 1
          fi

          if [[ ! "$TF_WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "Invalid TF_WIF_PROVIDER format: $TF_WIF_PROVIDER"
            echo "Expected: projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL_ID>/providers/<PROVIDER_ID>"
            echo "Fix by re-running infra/bootstrap/wif-setup.sh and updating GitHub secret TF_WIF_PROVIDER_*"
            exit 1
          fi

          echo "auth_enabled=true" >> "$GITHUB_OUTPUT"
          echo "workload_identity_provider=$TF_WIF_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "service_account=$TF_SA_EMAIL" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.auth-inputs.outputs.workload_identity_provider }}
          service_account: ${{ steps.auth-inputs.outputs.service_account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Initialize Terraform
        working-directory: infra/environments/${{ needs.detect-env.outputs.environment }}
        run: terraform init

      - name: Run Terraform Plan
        working-directory: infra/environments/${{ needs.detect-env.outputs.environment }}
        run: |
          terraform plan \
            -var-file="${{ needs.detect-env.outputs.tfvars-file }}" \
            -out=tfplan

      - name: Run Terraform Apply
        working-directory: infra/environments/${{ needs.detect-env.outputs.environment }}
        run: terraform apply tfplan

      # Intentionally omitted post-apply commit comments to keep deploy path
      # independent from comment API permissions and syntax/runtime errors.
